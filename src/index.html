<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="w-full py-4 flex justify-center items-center bg-white border-b border-gray-100">
        <div id="logo-container" class="max-w-[150px]">
            <button>
                <img src="./images/logo.png" alt="GameZone Logo" class="w-full h-auto object-contain">
            </button>
        </div>
    </header>
    <section id="main-header" class="px-4 py-2">
        <div class="flex items-center justify-between gap-4">
            
            <div class="flex-1 relative">
                <input type="text" placeholder="Search" class="w-full bg-gray-100 rounded-full py-2 px-4 outline-none focus:ring-2 focus:ring-orange-300">
            </div>
    
            <div class="flex-shrink-0">
                <img src="./images/account.png" alt="account" class="w-[40px] h-[40px] rounded-full">
            </div>
    
        </div>
    </section>

</body>
<script src="script.js"></script>
</html>
