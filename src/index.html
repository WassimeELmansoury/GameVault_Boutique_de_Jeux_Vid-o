<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body class="px-4">
    <header class="w-full flex justify-center items-center bg-white border-b border-gray-100">
        <div id="logo-container" class="max-w-[150px]">
            <button>
                <img src="./images/logo.png" alt="GameZone Logo" class="w-full h-auto object-contain">
            </button>
        </div>
    </header>
    <nav id="main-header" class="px-4 py-2">
        <div class="flex items-center justify-between gap-4">
            
            <div class="flex-1 relative">
                <input type="text" placeholder="Search" class="w-full bg-gray-100 rounded-full py-2 px-4 outline-none focus:ring-2 focus:ring-orange-300">
            </div>
    
            <div class="flex-shrink-0">
                <img src="./images/account.png" alt="user" class="w-[40px] h-[40px] rounded-full">
            </div>
        </div>
    </nav>
    <section id="filter-category">
        <div>
            <i class="fa fa-sliders text-xl"></i>
        </div>
        <div id="type-category">
        </div>
    </section>

</body>
<script src="script.js"></script>
</html>
